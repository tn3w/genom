name: Build

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'build.rs'
      - 'Cargo.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Record rustc version
        run: echo "RUSTC_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.toml') }}

      - name: Build genom CLI
        run: cargo build --release --bin genom

      - name: Build geo.bin
        run: ./target/release/genom build geo.bin

      - name: Verify geo.bin
        run: |
          ./target/release/genom 40.7128 -74.0060 geo.bin | grep -q 'code: "US"'
          ./target/release/genom 48.8566 2.3522 geo.bin | grep -q 'code: "FR"'
          ./target/release/genom 35.6762 139.6503 geo.bin | grep -q 'code: "JP"'
          python3 lookup.py 48.8566 2.3522 geo.bin | grep -q "'FR'"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          SIZE=$(du -h geo.bin | cut -f1)
          gh release create "$TAG" \
            geo.bin \
            --title "genom $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Automated genom database build.

          **geo.bin** ($SIZE) — reverse-geocoding database
          - GeoNames cities500, admin1/2, countryInfo, postal codes

          \`\`\`bash
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/geo.bin
          \`\`\`

          \`\`\`rust
          let geocoder = genom::Geocoder::open(\"geo.bin\")?;
          let place = geocoder.lookup(40.7128, -74.0060);
          \`\`\`"

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +6 \
            | xargs -rI{} gh release delete {} --yes --cleanup-tag

  deploy-docs:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
