[workspace]
members = ["."]

[package]
name = "genom"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Fast reverse geocoding with enriched location data"
license = "Apache-2.0"
authors = ["tn3w <tn3w@protonmail.com>"]
repository = "https://github.com/tn3w/genom"
homepage = "https://genom.tn3w.dev"
documentation = "https://docs.rs/genom"
readme = "README.md"
keywords = ["geocoding", "reverse-geocoding", "location", "geonames", "coordinates"]
categories = ["algorithms", "data-structures", "science::geo"]
exclude = ["data/", "target/", "build/cache/"]

[features]
default = []
no-build-database = []

[[bin]]
name = "genom"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
rustc-hash = "2.1"

[build-dependencies]
ureq = "2.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rustc-hash = "2.1"
shapefile = "0.6"

[package.metadata.funding]
buy_me_a_coffee = "tn3w"
url = "https://www.buymeacoffee.com/tn3w"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
