[package]
name = "genom"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
description = "Fast offline reverse geocoding with enriched location data"
license = "Apache-2.0"
authors = ["tn3w <tn3w@protonmail.com>"]
repository = "https://github.com/tn3w/genom"
homepage = "https://genom.tn3w.dev"
documentation = "https://docs.rs/genom"
readme = "README.md"
keywords = ["geocoding", "reverse-geocoding", "location", "geonames", "coordinates"]
categories = ["algorithms", "data-structures", "science::geo"]
exclude = ["data/", "docs-src/", "lookup.py"]

[features]
default = ["cli"]
cli = ["dep:ureq", "dep:zip"]
no-build-database = []

[[bin]]
name = "genom"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
ureq = { version = "3.3", optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate"], optional = true }

[build-dependencies]
ureq = "3.3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[package.metadata.funding]
buy_me_a_coffee = "tn3w"
url = "https://www.buymeacoffee.com/tn3w"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
